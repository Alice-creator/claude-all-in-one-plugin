<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AuraAd AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; height: 100dvh; overflow: hidden; }

    #camera    { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #clip-canvas { display: none; }

    #ad-video {
      position: fixed; display: none; pointer-events: none; z-index: 5;
      object-fit: fill; transform-origin: center center;
      mix-blend-mode: screen;
    }

    #scan-ui {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none; z-index: 10;
    }
    #scan-ring {
      width: 200px; height: 200px;
      border: 2px solid rgba(255,255,255,0.7); border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:.5; transform:scale(1); }
      50%      { opacity:1;  transform:scale(1.05); }
    }
    #scan-hint   { margin-top: 20px; font-size: 14px; color: rgba(255,255,255,.7); }
    #scan-status { margin-top: 8px;  font-size: 12px; color: rgba(255,255,255,.4); }

    #ar-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
      padding: 24px 20px 32px;
      flex-direction: row; align-items: flex-end; justify-content: space-between;
    }
    #ar-product-name { font-size: 18px; font-weight: 700; }
    #ar-score        { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 2px; }

    #track-badge {
      display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; padding: 4px 14px; border-radius: 999px; z-index: 20;
      background: rgba(0,0,0,.6); color: rgba(255,255,255,.5); white-space: nowrap;
    }
    #track-badge.on { color: #4ade80; }

    .btn { padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    .btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  </style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="clip-canvas"></canvas>
<video id="ad-video" loop muted playsinline></video>

<div id="scan-ui">
  <div id="scan-ring"></div>
  <p id="scan-hint">Point camera at a product</p>
  <p id="scan-status">Loading model…</p>
</div>
<div id="track-badge">Searching…</div>
<div id="ar-bar">
  <div>
    <p id="ar-product-name"></p>
    <p id="ar-score"></p>
  </div>
  <button class="btn btn-secondary" onclick="resetToScan()">Scan Again</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.17.0/dist/tf-backend-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
const API        = window.location.origin;
const camera     = document.getElementById('camera');
const clipCanvas = document.getElementById('clip-canvas');
const clipCtx    = clipCanvas.getContext('2d');
const trackBadge = document.getElementById('track-badge');
const adVideoEl  = document.getElementById('ad-video');

// Small canvas for fast COCO inference
const detectCanvas = document.createElement('canvas');
detectCanvas.width  = 320;
detectCanvas.height = 180;
const detectCtx = detectCanvas.getContext('2d');

// Medium canvas for AKAZE locate (needs more detail than COCO)
const locateCanvas = document.createElement('canvas');
locateCanvas.width  = 640;
locateCanvas.height = 480;
const locateCtx = locateCanvas.getContext('2d');

// ── State ─────────────────────────────────────────────────────────────────

let cameraStream   = null;
let scanTimer      = null;
let trackRaf       = null;
let detectTimer    = null;
let scanning       = false;
let currentProduct = null;
let cocoModel      = null;
let targetBbox     = null;
let visualBbox     = null;
let missCount      = 0;
let lastLocateAt   = 0;
let locating       = false;
const LERP         = 0.35;
const LOCATE_MS    = 800; // min gap between locate calls

// ── Init ──────────────────────────────────────────────────────────────────

async function init() {
  try { await tf.setBackend('wasm'); await tf.ready(); } catch {}
  const [model] = await Promise.all([
    cocoSsd.load({ base: 'lite_mobilenet_v2' }),
    startCamera(),
  ]);
  cocoModel = model;
  document.getElementById('scan-status').textContent = 'Scanning…';
  scanning = true;
  scheduleRecognize();
}

async function startCamera() {
  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
  }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
  camera.srcObject = cameraStream;
  await camera.play();
}

// ── Phase 1: CLIP recognition ─────────────────────────────────────────────

function scheduleRecognize() {
  if (!scanning) return;
  scanTimer = setTimeout(recognizeFrame, 1500);
}

async function recognizeFrame() {
  if (!scanning || camera.readyState < camera.HAVE_ENOUGH_DATA) {
    scheduleRecognize(); return;
  }
  // Crop to center 65% of frame — matches what user centers in the scan ring
  const vw = camera.videoWidth  || camera.offsetWidth;
  const vh = camera.videoHeight || camera.offsetHeight;
  const crop = Math.min(vw, vh) * 0.65;
  const cx = (vw - crop) / 2, cy = (vh - crop) / 2;
  clipCanvas.width = 224; clipCanvas.height = 224;
  clipCtx.drawImage(camera, cx, cy, crop, crop, 0, 0, 224, 224);

  clipCanvas.toBlob(async (blob) => {
    try {
      const fd = new FormData();
      fd.append('frame', blob, 'frame.jpg');
      const res  = await fetch(`${API}/recognition/recognize`, { method: 'POST', body: fd });
      const data = await res.json();
      if (data.matched) {
        scanning = false;
        clearTimeout(scanTimer);
        startTracking(data);
      } else {
        document.getElementById('scan-status').textContent =
          `Scanning… ${new Date().toLocaleTimeString()}`;
        scheduleRecognize();
      }
    } catch { scheduleRecognize(); }
  }, 'image/jpeg', 0.85);
}

// ── COCO class inference from product name ────────────────────────────────

const CLASS_MAP = {
  'cup':        ['coffee', 'cup', 'mug', 'tea', 'espresso', 'latte', 'cappuccino'],
  'bottle':     ['bottle', 'water', 'beer', 'wine', 'soda', 'juice', 'drink', 'beverage'],
  'wine glass': ['glass', 'cocktail', 'champagne'],
  'bowl':       ['bowl', 'soup', 'cereal', 'noodle'],
  'cell phone': ['phone', 'mobile', 'smartphone', 'iphone', 'android'],
  'laptop':     ['laptop', 'notebook', 'macbook'],
  'keyboard':   ['keyboard'],
  'mouse':      ['gaming mouse', 'computer mouse'],
  'book':       ['book', 'magazine', 'notebook'],
  'clock':      ['clock', 'watch'],
  'vase':       ['vase', 'flower'],
  'tv':         ['tv', 'television', 'monitor', 'screen', 'display'],
  'backpack':   ['backpack', 'bag', 'rucksack'],
  'handbag':    ['handbag', 'purse', 'wallet'],
};

function inferCocoClass(productName) {
  const lower = productName.toLowerCase();
  for (const [cocoClass, keywords] of Object.entries(CLASS_MAP)) {
    if (keywords.some(kw => lower.includes(kw))) return cocoClass;
  }
  return null;
}

// ── Phase 2: COCO-SSD detection + 2D overlay ─────────────────────────────

async function startTracking(product) {
  currentProduct = product;
  targetBbox     = null;
  visualBbox     = null;
  missCount      = 0;
  lastLocateAt   = 0;
  locating       = false;

  product.trackedClass = inferCocoClass(product.product_name);

  document.getElementById('ar-product-name').textContent = product.product_name;
  document.getElementById('ar-score').textContent =
    `Match confidence: ${Math.round(product.score * 100)}%`;

  adVideoEl.onerror = () => {
    trackBadge.textContent = 'Video error: ' + (adVideoEl.src || 'no src');
    trackBadge.className = '';
  };
  adVideoEl.src = product.ad_video_url || '';
  if (adVideoEl.src) adVideoEl.load();

  show('ar');
  detectLoop();
  renderLoop();
}

// COCO detection on downscaled 320x180 canvas for fast inference
async function detectLoop() {
  if (!currentProduct) return;
  if (camera.readyState >= camera.HAVE_ENOUGH_DATA) {
    try {
      detectCtx.drawImage(camera, 0, 0, 320, 180);
      const preds = await cocoModel.detect(detectCanvas);
      const bbox  = pickBest(preds, currentProduct.trackedClass);
      if (bbox) {
        targetBbox = bbox;
        missCount  = 0;
        trackBadge.textContent = `Tracking ✓  ${bbox.class} (${Math.round(bbox.score * 100)}%)`;
        trackBadge.className   = 'on';
      } else {
        missCount++;
        trackBadge.textContent = 'Searching…';
        trackBadge.className   = '';
        // Fall back to AKAZE feature matching for flat images / unknown classes
        const now = Date.now();
        if (!locating && now - lastLocateAt > LOCATE_MS) {
          locateFrame();
        }
      }
    } catch {}
  }
  detectTimer = setTimeout(detectLoop, 30);
}

async function locateFrame() {
  if (!currentProduct || locating) return;
  locating = true;
  lastLocateAt = Date.now();
  try {
    locateCtx.drawImage(camera, 0, 0, 640, 480);
    const blob = await new Promise(res => locateCanvas.toBlob(res, 'image/jpeg', 0.8));
    const fd = new FormData();
    fd.append('frame', blob, 'frame.jpg');
    const res  = await fetch(`${API}/recognition/locate/${currentProduct.product_id}`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.bbox) {
      targetBbox = data.bbox;
      missCount  = 0;
      trackBadge.textContent = 'Tracking ✓ (image match)';
      trackBadge.className   = 'on';
    }
  } catch {}
  locating = false;
}

// rAF render loop — lerps bbox and positions the ad video overlay
function renderLoop() {
  if (!currentProduct) return;

  if (targetBbox) {
    if (!visualBbox) {
      visualBbox = { ...targetBbox };
    } else {
      visualBbox.x1 += LERP * (targetBbox.x1 - visualBbox.x1);
      visualBbox.y1 += LERP * (targetBbox.y1 - visualBbox.y1);
      visualBbox.x2 += LERP * (targetBbox.x2 - visualBbox.x2);
      visualBbox.y2 += LERP * (targetBbox.y2 - visualBbox.y2);
    }

    updateOverlay(visualBbox);

    if (missCount <= 12) {
      adVideoEl.style.display = 'block';
      if (adVideoEl.paused) adVideoEl.play().catch(() => {});
    } else {
      adVideoEl.style.display = 'none';
      adVideoEl.pause();
    }
  }

  trackRaf = requestAnimationFrame(renderLoop);
}

function updateOverlay(bbox) {
  const sw = window.innerWidth, sh = window.innerHeight;
  const bw = (bbox.x2 - bbox.x1) * sw * 1.8;  // 1.8× so effects extend beyond bottle edges
  const bh = (bbox.y2 - bbox.y1) * sh * 1.8;
  const cx = bbox.x1 * sw + (bbox.x2 - bbox.x1) * sw / 2;
  const cy = bbox.y1 * sh + (bbox.y2 - bbox.y1) * sh / 2;

  if (sw < sh) {
    // Portrait phone + landscape video — rotate 90°
    // element w=bh, h=bw → after rotate: visual w=bw, visual h=bh, centered on (cx,cy)
    adVideoEl.style.width     = bh + 'px';
    adVideoEl.style.height    = bw + 'px';
    adVideoEl.style.left      = (cx - bh / 2) + 'px';
    adVideoEl.style.top       = (cy - bw / 2) + 'px';
    adVideoEl.style.transform = 'rotate(90deg)';
  } else {
    adVideoEl.style.width     = bw + 'px';
    adVideoEl.style.height    = bh + 'px';
    adVideoEl.style.left      = (cx - bw / 2) + 'px';
    adVideoEl.style.top       = (cy - bh / 2) + 'px';
    adVideoEl.style.transform = '';
  }
}

function pickBest(preds, classFilter) {
  const cw = detectCanvas.width, ch = detectCanvas.height;
  const cx = cw / 2, cy = ch / 2;
  let best = null, bestDist = Infinity;
  for (const p of preds) {
    if (p.score < 0.35) continue;
    if (classFilter && p.class !== classFilter) continue;
    const [x, y, w, h] = p.bbox;
    const dx = (x + w/2) - cx, dy = (y + h/2) - cy;
    const dist = dx*dx + dy*dy;
    if (dist < bestDist) {
      bestDist = dist;
      best = { x1: x/cw, y1: y/ch, x2: (x+w)/cw, y2: (y+h)/ch, class: p.class, score: p.score };
    }
  }
  return best;
}

// ── Reset ─────────────────────────────────────────────────────────────────

function resetToScan() {
  currentProduct = null;
  targetBbox = null;
  visualBbox = null;
  lastLocateAt = 0;
  locating = false;
  cancelAnimationFrame(trackRaf);
  clearTimeout(detectTimer);
  adVideoEl.pause();
  adVideoEl.src = '';
  adVideoEl.style.display = 'none';
  show('scanning');
  scanning = true;
  document.getElementById('scan-status').textContent = 'Scanning…';
  scheduleRecognize();
}

// ── UI ────────────────────────────────────────────────────────────────────

function show(state) {
  document.getElementById('scan-ui').style.display = state === 'scanning' ? 'flex' : 'none';
  document.getElementById('ar-bar').style.display  = state === 'ar' ? 'flex' : 'none';
  trackBadge.style.display = state === 'ar' ? 'block' : 'none';
}

init().catch(e => {
  document.getElementById('scan-hint').textContent = 'Error: ' + e.message;
});
</script>
</body>
</html>
